note: >-
  Sempra Energy documents no rate limits, quotas, burst allowances or throttling response
  headers on any public surface. The API program runs on Google Apigee (api.sempra.com
  returns the Apigee messaging.adaptors.http.flow.ApplicationNotFound fault for unrouted
  requests), and Apigee Quota/SpikeArrest policies are commonly applied there — but
  nothing about them is published. A proxy IS routed at basepath /v1, but it rejects every
  anonymous request at the OAuthV2 policy (HTTP 401) before any quota policy could emit a
  header, so no live rate-limit signal is observable and nothing is asserted here. The portal's
  anonymous API catalog is empty, so there is no operation, product or plan whose limits
  could be read. This is a documented absence, not an inference that limits do not exist.
