description: >-
  Sempra Energy is a San Diego-headquartered North American energy infrastructure
  holding company and a Fortune 500 constituent, operating regulated utilities and
  energy infrastructure across California, Texas and Mexico. Its businesses include San
  Diego Gas & Electric and Southern California Gas Company in California, Oncor
  Electric Delivery in Texas, and Sempra Infrastructure, which develops LNG export
  terminals, natural gas pipelines and renewable generation in North America. Sempra
  operates a Google Apigee API program — an API gateway at api.sempra.com and a
  developer portal at developer.sempra.com inviting developers to "sign up today and
  start using Sempra APIs" — but publishes no API product, contract or reference to
  unauthenticated visitors, so the entire integration surface sits behind portal
  registration.
