apis:
  - name: Sempra Developer Portal APIs
    description: >-
      Sempra Energy runs a Google Apigee API program. api.sempra.com is the Apigee
      runtime gateway — an unrouted request returns the genuine Apigee
      messaging.adaptors.http.flow.ApplicationNotFound JSON fault — and
      developer.sempra.com is an Apigee integrated developer portal (Apigee organization
      "sempra", site id "sempra-prod") whose home page reads "Sempra Developer Portal —
      Sign up today and start using Sempra APIs". Both hosts present DigiCert EV
      certificates issued to O=Sempra Energy, San Diego, California, which is how
      ownership was established. As of 2026-08-28 the portal publishes NOTHING to
      anonymous visitors: its own catalog endpoint
      /portals/api/sites/sempra-prod/liveportal/apis returns HTTP 200 with
      "apiDocs": [] and "apiProducts": [], and the only header menu items are "APIs" and
      "Log In". No OpenAPI, reference, operation list, plan or rate limit is publicly
      reachable — every API product is gated behind portal registration. Anonymous probing
      does establish that a live proxy is routed at basepath /v1: every path under it
      (/v1/graphql, /v1/token, /v1/graphql/health) returns HTTP 401 with an Apigee OAuthV2
      fault and a WWW-Authenticate Bearer challenge, while /v2/* and /oauth/token return the
      Apigee "no proxy routed" 404. The gateway advertises GET, PUT, POST, DELETE, OPTIONS
      and PATCH via a wildcard CORS policy, so there is a real read/write surface behind the
      OAuth wall — but no operation, schema or scope is published.
    humanURL: https://developer.sempra.com
    baseURL: https://api.sempra.com/v1
