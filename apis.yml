  reason: partner-login
  detail: >-
    Sempra Energy's Google Apigee developer portal at developer.sempra.com is publicly
    reachable and invites developers to "sign up today and start using Sempra APIs", but
    its own anonymous catalog endpoint /portals/api/sites/sempra-prod/liveportal/apis
    answers HTTP 200 with "apiDocs": [] and "apiProducts": [] — not one API product is
    published to unauthenticated visitors, so the contract, reference and operation list
    exist only behind portal registration and login. A live proxy is routed at
    https://api.sempra.com/v1 and answers every anonymous request with an Apigee
    oauth.v2.InvalidAccessToken 401, so the API is real and callable — just not by anyone
    who has not been issued a token through that portal.
